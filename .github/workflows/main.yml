name: Build ZeroRh Transfer APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify project files
        run: ls -la ZeroRhTransfer

      - name: Build APK
        working-directory: ZeroRhTransfer
        run: gradle assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZeroRh-Transfer-APK
          path: ZeroRhTransfer/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
